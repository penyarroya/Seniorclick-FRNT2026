<div class="search-field">
  <mat-form-field appearance="outline">
    <mat-icon matPrefix>search</mat-icon>
    
    <input matInput 
           [placeholder]="placeholder()" 
           [(ngModel)]="query" 
           (input)="onInputChange()">

    <button *ngIf="query" 
            matSuffix 
            mat-icon-button
            color="primary" 
            type="button"
            (click)="clearSearch()">
      <mat-icon>close</mat-icon>
    </button>
  </mat-form-field>
</div>
