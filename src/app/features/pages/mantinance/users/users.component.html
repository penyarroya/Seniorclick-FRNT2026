<app-maintenance-layout
  [title]="'Usuarios'"
  [showViewAction]="false" 
  [columns]="columns"
  [service]="userService"
  (onCreate)="createUser()"
  (onEdit)="editUser($event)"
  (onDelete)="deleteUser($event)">
</app-maintenance-layout>

<div class="modal dark-theme-form" *ngIf="showModal">
  <div class="modal-content">
    <h3>{{ currentUser?.id ? 'Editar Usuario' : 'Crear Usuario' }}</h3>

    <form [formGroup]="form" (ngSubmit)="saveUser()">
      
      <div class="form-row">
        <div class="form-group half">
          <label>Nombre</label>
          <input formControlName="firstName" type="text" placeholder="Ej: Juan" />
        </div>
        <div class="form-group half">
          <label>Apellido</label>
          <input formControlName="lastName" type="text" placeholder="Ej: Pérez" />
        </div>
      </div>

      <div class="form-group">
        <label>Teléfono (Opcional)</label>
        <input formControlName="phone" type="text" placeholder="+34 600 000 000" />
      </div>

      <hr class="form-divider">

      <div class="form-group">
        <label>Nombre de usuario</label>
        <input formControlName="username" type="text" placeholder="Mínimo 3 caracteres" />
        <div class="error" *ngIf="form.get('username')?.invalid && form.get('username')?.touched">
          <span *ngIf="form.get('username')?.hasError('required')">El nombre es obligatorio.</span>
          <span *ngIf="form.get('username')?.hasError('minlength')">Mínimo 3 caracteres.</span>
          <span *ngIf="form.get('username')?.hasError('usernameTaken')">Ese nombre ya está en uso.</span>
        </div>
      </div>

      <div class="form-group">
        <label>Email</label>
        <input formControlName="email" type="email" placeholder="ejemplo@correo.com" />
        <div class="error" *ngIf="form.get('email')?.invalid && form.get('email')?.touched">
          <span *ngIf="form.get('email')?.hasError('required')">El email es obligatorio.</span>
          <span *ngIf="form.get('email')?.hasError('pattern')">Formato inválido.</span>
          <span *ngIf="form.get('email')?.hasError('emailTaken')">Este correo ya está registrado.</span>
        </div>
      </div>

      <div class="form-group">
        <label>Contraseña {{ currentUser?.id ? '(Opcional)' : '' }}</label>
        <div class="password-container">
          <input [type]="showPassword ? 'text' : 'password'" formControlName="password" placeholder="••••••••" />
          <button type="button" (click)="togglePasswordVisibility()" class="btn-icon">
            <mat-icon>{{ showPassword ? 'visibility_off' : 'visibility' }}</mat-icon>
          </button>
        </div>
        <div class="error" *ngIf="form.get('password')?.invalid && form.get('password')?.touched">
          <span *ngIf="form.get('password')?.hasError('required')">La contraseña es obligatoria.</span>
          <span *ngIf="form.get('password')?.hasError('passwordComplexity')">
            9+ carac., Mayús., Minús., Núm. y Símbolo.
          </span>
        </div>
      </div>

      <div class="form-group">
        <label>Roles del Sistema</label>
        <mat-form-field appearance="outline" class="roles-field" style="width: 100%; margin-top: 5px;">
          <mat-select formControlName="roles" multiple placeholder="Seleccione roles">
            <mat-option *ngFor="let role of allRoles()" [value]="role.name">
              {{ role.name }}
            </mat-option>
          </mat-select>
        </mat-form-field>
      </div>

      <div class="form-group">
        <label class="checkbox-label">
          <input formControlName="activo" type="checkbox" /> Activo
        </label>
      </div>

      <div class="modal-actions">
        <button type="submit" [disabled]="form.invalid || form.pending">
          {{ form.pending ? 'Validando...' : (currentUser?.id ? 'Actualizar' : 'Guardar') }}
        </button>
        <button type="button" (click)="closeModal()">Cancelar</button>
      </div>

    </form>
  </div>
</div>
