<app-maintenance-layout
  title="Gestión de Temas (Topics)"
  [showViewAction]="false" 
  [columns]="columns"
  [service]="topicService"
  (onCreate)="createTopic()"
  (onEdit)="editTopic($event)"
  (onDelete)="deleteTopic($event)"
></app-maintenance-layout>

<div class="modal" *ngIf="showModal">
  <div class="modal-content">
    <h3>{{ isEditing ? 'Editar Tema' : 'Nuevo Tema' }}</h3>

    <form [formGroup]="form" (ngSubmit)="saveTopic()">
      
      <div class="form-group">
        <label>Título del Tema</label>
        <mat-form-field appearance="outline">
          <input matInput formControlName="title" placeholder="Ej: Introducción a Decoradores">
          <mat-error *ngIf="form.get('title')?.invalid">El título es obligatorio</mat-error>
        </mat-form-field>
      </div>

      <div class="form-group">
        <label>Colección Perteneciente</label>
        <mat-form-field appearance="outline">
          <mat-select formControlName="collectionId" placeholder="Seleccione una colección">
            <mat-option *ngFor="let coll of collections" [value]="coll.id">
              {{ coll.name }}
            </mat-option>
          </mat-select>
          <mat-error *ngIf="form.get('collectionId')?.invalid">Debe asignar una colección</mat-error>
        </mat-form-field>
      </div>

      <div class="modal-actions">
        <button type="submit" class="btn-save" [disabled]="form.invalid">
          {{ isEditing ? 'Guardar Cambios' : 'Crear Tema' }}
        </button>
        <button type="button" class="btn-cancel" (click)="closeModal()">
          Cancelar
        </button>
      </div>
    </form>
  </div>
</div>
